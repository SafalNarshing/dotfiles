# hyprlock — macOS-style lock screen
#
# Layout mirrors macOS: blurred wallpaper, large clock high on the screen,
# circular avatar centred, name beneath it, then a pill password field.
#
# NOTE ON THIS PANEL: the display is OLED with no backlight, so brightness is
# handled by wl-gammarelay-rs (gamma ramps), which does NOT run inside
# hyprlock. The lock screen therefore always renders at full gamma regardless
# of the brightness level set in the session. That is expected, not a bug.

general {
    hide_cursor = true
    ignore_empty_input = true
    immediate_render = true
}

# Wallpaper, blurred and darkened the way macOS dims behind the login UI.
background {
    monitor =
    path = /home/spidey/Pictures/Wallpapers/space.png
    blur_passes = 1
    blur_size = 3
    noise = 0.0092
    contrast = 1.0
    brightness = 0.75
    vibrancy = 0.17
    vibrancy_darkness = 0.05
}

# ---------------------------------------------------------------- clock

label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = rgba(255, 255, 255, 0.95)
    font_size = 108
    font_family = JetBrainsMono Nerd Font ExtraBold
    position = 0, 320
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 6
    shadow_color = rgba(0, 0, 0, 0.45)
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %e %B"
    color = rgba(255, 255, 255, 0.80)
    font_size = 20
    font_family = JetBrainsMono Nerd Font
    position = 0, 232
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(0, 0, 0, 0.40)
}

# --------------------------------------------------------------- avatar

# Circular user image. hyprlock has no dedicated avatar widget, so this is an
# image widget with a full-radius border — rounding must be -1 for a circle.
image {
    monitor =
    path = /home/spidey/Pictures/Wallpapers/spidey_avatar.jpg
    size = 118
    rounding = -1
    border_size = 2
    border_color = rgba(255, 255, 255, 0.55)
    position = 0, 20
    halign = center
    valign = center
}

label {
    monitor =
    text = $USER
    color = rgba(255, 255, 255, 0.92)
    font_size = 19
    font_family = JetBrainsMono Nerd Font SemiBold
    position = 0, -70
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(0, 0, 0, 0.40)
}

# ------------------------------------------------------- password field

input-field {
    monitor =
    size = 260, 46
    outline_thickness = 1
    dots_size = 0.24
    dots_spacing = 0.42
    dots_center = true
    dots_rounding = -1
    rounding = 23

    outer_color = rgba(255, 255, 255, 0.50)
    inner_color = rgba(255, 255, 255, 0.22)
    font_color = rgba(255, 255, 255, 0.95)
    font_family = JetBrainsMono Nerd Font

    check_color  = rgba(203, 166, 247, 0.90)
    fail_color   = rgba(224, 140, 154, 0.95)

    # No feedback text at all. hyprlock 0.9.6 has no clear_on_fail option, but
    # it wipes the password buffer internally on every failed attempt — so with
    # both of these blank and fade_on_empty on, a wrong password just makes the
    # box vanish rather than announcing itself. A correct one unlocks.
    fail_text    =
    check_text   =

    # macOS behaviour: no password box until the user actually starts entering
    # one. fade_on_empty hides the field whenever it is empty, so the lock
    # screen opens clean and the box fades in on the first keypress.
    # Set this to false if you ever want the box visible at all times.
    fade_on_empty = true
    fade_timeout = 350

    placeholder_text = <span foreground="##ffffffcc">Enter Password</span>
    hide_input = false
    capslock_color = rgba(224, 200, 138, 0.90)

    position = 0, 150
    halign = center
    valign = bottom
}

# ------------------------------------------------------------ status row

# Battery and keyboard layout, small and low — the equivalent of macOS's
# menu-bar remnants on the lock screen.
label {
    monitor =
    text = cmd[update:30000] printf "$(cat /sys/class/power_supply/BAT1/capacity)%% · $(cat /sys/class/power_supply/BAT1/status)"
    color = rgba(255, 255, 255, 0.55)
    font_size = 13
    font_family = JetBrainsMono Nerd Font
    position = 0, 40
    halign = center
    valign = bottom
}

# Sits just under where the password box fades in.
label {
    monitor =
    text = Enter your password
    color = rgba(255, 255, 255, 0.40)
    font_size = 12
    font_family = JetBrainsMono Nerd Font
    position = 0, 100
    halign = center
    valign = bottom
}
