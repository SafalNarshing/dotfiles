# hypridle — idle and lid handling
#
# TWO THINGS HERE ARE SPECIFIC TO THIS MACHINE, do not replace them with the
# usual snippets from online guides:
#
# 1. DPMS must be dispatched as Lua. This config uses Hyprland's Lua format,
#    where the classic `hyprctl dispatch dpms off` FAILS — dispatch expects a
#    Lua expression. The correct form is hl.dsp.dpms("off").
#    Also note dpms() does not validate its argument: anything that is not
#    "on" is treated as off.
#
# 2. Dimming goes through wl-gammarelay-rs, not brightnessctl. The panel is
#    OLED with no backlight, so every backlight-based dim is a no-op. The
#    gamma level is saved before dimming and restored on resume.

general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms("on")'
    ignore_dbus_inhibit = false
    ignore_systemd_inhibit = false
}

# 2.5 min — dim the screen as a warning, via gamma.
listener {
    timeout = 150
    on-timeout = /home/spidey/.config/hypr/scripts/idle-dim.sh dim
    on-resume  = /home/spidey/.config/hypr/scripts/idle-dim.sh restore
}

# 5 min — lock.
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# 6 min — screen off. Kept after the lock so the display never blanks while
# still unlocked.
listener {
    timeout = 360
    on-timeout = hyprctl dispatch 'hl.dsp.dpms("off")'
    on-resume  = hyprctl dispatch 'hl.dsp.dpms("on")'
}

# 30 min — suspend.
listener {
    timeout = 1800
    on-timeout = systemctl suspend
}
