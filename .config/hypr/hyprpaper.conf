# hyprpaper 0.8.x config — single static wallpaper, no rotation.
#
# NOTE: 0.8.x dropped the old `preload = ...` / `wallpaper = ,...` syntax.
# It now uses a `wallpaper { }` category. Old-format configs parse without
# error but silently produce "Monitor eDP-1 has no target" and no wallpaper.
#
# Keys: monitor, path, fit_mode (cover|contain|tile)
# An empty `monitor =` applies to all outputs.
# Paths must be absolute — `~` is NOT expanded here.
#
# To change wallpaper, edit `path` below, then restart the daemon:
#   pkill hyprpaper; sleep 1; setsid hyprpaper >/dev/null 2>&1 </dev/null &
# Verify with:
#   hyprctl hyprpaper listactive
#
# Available in ~/Pictures/Wallpapers:
#   venom_wp.jpg  blendpills-d.jpg  glass-chip-d.jpg  dithered-sun-d.jpg  balls-d.jpg

wallpaper {
    monitor =
    path = /home/spidey/Pictures/Wallpapers/venom_wp.jpg
    fit_mode = cover
}
