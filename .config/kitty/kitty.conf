font_family JetBrainsMono Nerd Font
font_size 11.0

# Clear translucency, no blur (see the kitty-no-blur window rule in
# hyprland.lua). Because blur is off, decoration.blur.brightness no longer
# dims the backdrop, so this value is the only thing darkening the window —
# hence slightly higher than the 0.72 used while blur was on.
# Tune live on a running window with:
#   kitty @ set-background-opacity 0.85
background_opacity 0.86
dynamic_background_opacity yes

# Lets `kitty @ set-background-opacity 0.6` tune this live
allow_remote_control yes
listen_on unix:@mykitty

# Breathing room inside the window
window_padding_width 10

# No titlebar/decorations; Hyprland draws the border
hide_window_decorations yes

confirm_os_window_close 0
