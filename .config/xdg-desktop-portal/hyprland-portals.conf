# Portal backend preferences for the Hyprland session.
# Read because XDG_CURRENT_DESKTOP=Hyprland.
#
# Why this file is needed: gnome.portal ALSO declares
# org.freedesktop.impl.portal.ScreenCast, and GNOME is installed on this
# machine as the fallback session. With no preference stated, xdg-desktop-portal
# can route screen sharing to GNOME's backend, which depends on mutter and
# fails under Hyprland — the usual "screen share shows a black window" symptom.
#
# So: screencast/screenshot go to hyprland, file dialogs stay with gtk (the
# hyprland backend does not implement FileChooser).

[preferred]
default=hyprland
org.freedesktop.impl.portal.ScreenCast=hyprland
org.freedesktop.impl.portal.Screenshot=hyprland
org.freedesktop.impl.portal.FileChooser=gtk
org.freedesktop.impl.portal.AppChooser=gtk
org.freedesktop.impl.portal.Settings=gtk
org.freedesktop.impl.portal.Notification=gtk
org.freedesktop.impl.portal.Print=gtk
org.freedesktop.impl.portal.Secret=gnome-keyring
