# Brave reads THIS file. ~/.config/chromium-flags.conf is only read by the
# `chromium` package, so flags placed there never reached Brave.

--ozone-platform-hint=auto

# VA-API decode on the GL backend. Paired with LIBVA_DRIVER_NAME=iHD in
# hyprland.lua so decode lands on the Intel node the compositor advertises
# for dmabuf — decoding on the dGPU instead causes eglCreateImage
# EGL_BAD_MATCH on every site that serves H.264.
--enable-features=VaapiVideoDecodeLinuxGL,VaapiIgnoreDriverChecks

# The ChromeOS direct decoder path is not usable here.
--disable-features=UseChromeOSDirectVideoDecoder
