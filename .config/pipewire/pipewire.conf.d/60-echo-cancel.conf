# Clean Mic, stage 1 of 2: echo cancellation (WebRTC, ships with PipeWire).
#
#   laptop mic ──► [this: echo removal] ──► [70-rnnoise: noise + voice gate] ──► "Clean Mic"
#
# monitor.mode uses whatever the default output is playing as the echo
# reference, so audio does not have to be routed through a virtual sink.
# Noise suppression is left to RNNoise in stage 2; doing it twice muffles voice.
#
# UNDO
#   Just switch back:  pick "Built-in Audio Analog Stereo" as the input in
#                      pavucontrol (Input Devices tab), or per app.
#   Remove entirely:   rm ~/.config/pipewire/pipewire.conf.d/{60-echo-cancel,70-rnnoise}.conf
#                      systemctl --user restart pipewire pipewire-pulse wireplumber
context.modules = [
    {   name = libpipewire-module-echo-cancel
        args = {
            library.name  = aec/libspa-aec-webrtc
            monitor.mode  = true
            audio.channels = 1
            audio.position = [ MONO ]
            aec.args = {
                webrtc.high_pass_filter  = true   # cut desk thumps / low rumble
                webrtc.noise_suppression = false  # RNNoise does this, better
                webrtc.gain_control      = false  # AGC pumps background noise up
                webrtc.extended_filter   = true   # longer echo tail, laptop speakers
            }
            capture.props = {
                node.name     = "capture.clean_mic_aec"
                target.object = "alsa_input.pci-0000_00_1f.3.analog-stereo"
                node.passive  = true
            }
            source.props = {
                node.name        = "clean_mic_aec"
                node.description = "Clean Mic (echo removal only)"
                priority.session = 100
            }
        }
    }
]
