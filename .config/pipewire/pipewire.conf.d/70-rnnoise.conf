# Clean Mic, stage 2 of 2: RNNoise noise suppression + voice-only gate.
# Needs: pacman -S noise-suppression-for-voice
#
# Takes the echo-cancelled mic from 60-echo-cancel.conf and exposes the final
# "Clean Mic" source. Its high session priority makes it the default input.
#
# Tuning (edit, then: systemctl --user restart pipewire pipewire-pulse wireplumber)
#   VAD Threshold          How sure RNNoise must be that you're speaking before
#                          the mic opens. Higher = stricter, can clip quiet
#                          words. 0 disables the gate (noise removal only).
#   VAD Grace Period       How long the mic stays open after you stop talking,
#                          so word endings aren't cut.
#   Retroactive VAD Grace  Also lets through audio just *before* speech was
#                          detected, so first syllables survive. Adds this
#                          much latency.
#
# UNDO: see 60-echo-cancel.conf.
context.modules = [
    {   name = libpipewire-module-filter-chain
        args = {
            node.description = "Clean Mic"
            media.name       = "Clean Mic"
            filter.graph = {
                nodes = [
                    {   type   = ladspa
                        name   = rnnoise
                        plugin = /usr/lib/ladspa/librnnoise_ladspa.so
                        label  = noise_suppressor_mono
                        control = {
                            "VAD Threshold (%)"          = 50.0
                            "VAD Grace Period (ms)"      = 300
                            "Retroactive VAD Grace (ms)" = 30
                        }
                    }
                ]
            }
            capture.props = {
                node.name      = "capture.clean_mic"
                target.object  = "clean_mic_aec"
                node.passive   = true
                audio.rate     = 48000
                audio.channels = 1
                audio.position = [ MONO ]
            }
            playback.props = {
                node.name        = "clean_mic"
                media.class      = Audio/Source
                priority.session = 2000
                audio.rate       = 48000
                audio.channels   = 1
                audio.position   = [ MONO ]
            }
        }
    }
]
